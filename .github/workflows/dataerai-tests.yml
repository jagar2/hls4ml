name: Dataerai integration tests
on:
  push:
    branches: ['codex/dataerai-provenance']
  pull_request:
    paths:
      - 'hls4ml/provenance/**'
      - 'hls4ml/model/**'
      - 'hls4ml/converters/**'
      - 'hls4ml/cli/**'
      - 'test/pytest/test_dataerai_provenance.py'
      - 'test/pytest/test_dataerai_tutorials.py'
      - 'test/pytest/test_dataerai_preservation.py'
      - 'docs/advanced/dataerai*.md'
      - 'docs/tutorials/dataerai/**'
      - '.github/workflows/dataerai-*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . pytest
      - run: python -m pytest -q test/pytest/test_dataerai_provenance.py
      - run: python -m pytest -q test/pytest/test_dataerai_tutorials.py
      - run: python -m pytest -q test/pytest/test_dataerai_preservation.py
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install sphinx myst-parser
      - run: sphinx-build -W --keep-going -b html -c docs/tutorials/dataerai/sphinx docs .dataerai/docs-html
